name: PR
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run_ci:
    name: Run CI
    # A called workflow cannot exceed its caller, so this must allow the write
    # permission that create_release declares. ci.yml defaults its jobs to
    # read-only, and create_release is skipped for pull requests.
    permissions:
      contents: write
    uses: ./.github/workflows/ci.yml
