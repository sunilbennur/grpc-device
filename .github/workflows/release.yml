name: Release
# Kept separate from CI so that "contents: write" is never reachable from the
# PR workflow, which calls ci.yml.
on:
  push:
    branches:
      - 'releases/**'

permissions:
  contents: read

jobs:
  validate_imported_protos:
    uses: ./.github/workflows/validate_imported_protos.yml
  validate_python:
    uses: ./.github/workflows/validate_python.yml
  build_desktop:
    needs:
      - validate_imported_protos
      - validate_python
    uses: ./.github/workflows/build_cmake.yml
  build_nilrt:
    needs:
      - validate_imported_protos
      - validate_python
    uses: ./.github/workflows/build_nilrt.yml
  run_win_system_tests:
    needs: build_desktop
    uses: ./.github/workflows/run_win_system_tests.yml
  create_client_artifacts:
    uses: ./.github/workflows/create_client_artifacts.yml
  create_release:
    needs:
      - build_desktop
      - build_nilrt
      - create_client_artifacts
    permissions:
      contents: write # Create the draft release and upload its assets.
    uses: ./.github/workflows/create_release.yml
