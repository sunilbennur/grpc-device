# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# - cooldown: wait 7 days after an upstream release before proposing it, so
#   compromised or quickly-yanked releases are not picked up immediately.
# - open-pull-requests-limit: keep the number of open update PRs manageable.
# - Compatibility issues raised by these PRs are triaged by the repository owners.
version: 2
updates:
  # GitHub Actions used by .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # Codegen / build tooling (python_build_requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # Python examples (Poetry: examples/pyproject.toml + poetry.lock)
  - package-ecosystem: "pip"
    directory: "/examples"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # Native dependencies vendored as git submodules (grpc, json, utfcpp,
  # grpc-sideband, googletest, spdlog, ni-apis). Submodule bumps can be large,
  # so check monthly and allow only a few open PRs at a time.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
